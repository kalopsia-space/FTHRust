name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The test binaries' link step ran out of disk (ld: Bus error).
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libwayland-dev mesa-vulkan-drivers libxkbcommon-dev fonts-noto-mono fonts-dejavu-core fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build -p fthrust-engine
      - run: cargo test --workspace
        env:
          WGPU_BACKEND: vulkan
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  uidrive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libwayland-dev mesa-vulkan-drivers libxkbcommon-dev cage grim dbus fonts-noto-mono fonts-dejavu-core fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # Release: a debug UI rasterised by llvmpipe on the runner's few cores
      # takes seconds per frame on first page visits and misses the
      # scenarios' 5 s waits.
      - run: cargo build --release -p fthrust-ui -p fthrust-engine
      - run: cd tools/uidrive && cargo build
      - run: tools/uidrive/bench.sh run tools/uidrive/scenarios/smoke.sh --release --renderer pixman --settings tools/uidrive/ci-settings.json
      - run: tools/uidrive/bench.sh run tools/uidrive/scenarios/save_clip.sh --release --renderer pixman --settings tools/uidrive/ci-settings.json
      - run: tools/uidrive/bench.sh run tools/uidrive/scenarios/export.sh --release --renderer pixman --settings tools/uidrive/ci-settings.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uidrive-bench
          path: /tmp/uidrive-*/
