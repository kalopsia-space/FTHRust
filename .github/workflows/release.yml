name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
# Two runs for one tag would race to publish it, and a half-published release
# is worse than a late one: never cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    # Tags only. Fails within seconds, before CI and the build, when the tag
    # does not match the workspace version or CHANGES.md has no section for it.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/check-version.sh --tag "$GITHUB_REF"
      - run: packaging/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
  ci:
    # A tag only becomes a release when the whole CI is green on its commit.
    # A hand-started run builds the artifact and publishes nothing, so it
    # skips this.
    needs: notes
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
  appimage:
    needs: [notes, ci]
    # notes and ci are skipped on a hand-started run; a failure of either
    # stops the build.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    # The release baseline: glibc 2.35 (packaging/linux_release_baseline.json).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      # Build provenance attestations (actions/attest).
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # Keep in step with packaging/Dockerfile (subversion is for the source archive, which the image can build too).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config clang libclang-dev meson ninja-build libwayland-dev libxkbcommon-dev patchelf file jq xz-utils desktop-file-utils squashfs-tools git subversion
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
      - name: Read the pinned cargo-about version
        id: about
        run: echo "version=$(sed -n 's/^CARGO_ABOUT_VERSION=//p' tools/gen-notices.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about@${{ steps.about.outputs.version }}
      - run: packaging/build-appimage.sh
      - run: cd dist && sha256sum -c FTHRust-*.sha256
      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/FTHRust-*.AppImage
            dist/FTHRust-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fthrust-appimage-${{ github.sha }}
          path: |
            dist/FTHRust-*.AppImage
            dist/FTHRust-*.AppImage.sha256
            dist/FTHRust-*.tar.gz
            dist/FTHRust-*.tar.gz.sha256
          retention-days: 7
  source:
    # The source behind the bundled FFmpeg travels with the release: BtbN's monthly assets are pruned after about two
    # years, and the libraries compiled into them (one of them GPL) come with their source. It needs nothing from the
    # build, so it is a job of its own: about a hundred fetches from a dozen hosts can fail for reasons that have
    # nothing to do with the build, and re-running just this job does not repeat the 30 to 40 minutes of it.
    needs: [notes, ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    # Every fetch is tried up to 10 times, each attempt under a longer timeout (packaging/archive-ffmpeg-source.sh).
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The archive script gets the job's token by hand (below); nothing else needs it left in .git/config.
          persist-credentials: false
      # LAME is pinned to a Subversion revision, which needs svn.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends subversion
      - name: Archive the source
        env:
          # Requests to github.com carry the job's token, the way actions/checkout sends it: about a hundred anonymous
          # fetches from one runner address are what GitHub's rate limits are for.
          ARCHIVE_GITHUB_TOKEN: ${{ github.token }}
        run: packaging/archive-ffmpeg-source.sh --out "dist/FTHRust-ffmpeg-source-$(jq -r .corresponding_source.ffmpeg.describe packaging/ffmpeg_manifest_linux.json).tar.xz"
      - run: cd dist && sha256sum -c FTHRust-*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fthrust-source-${{ github.sha }}
          path: |
            dist/FTHRust-ffmpeg-source-*.tar.xz
            dist/FTHRust-ffmpeg-source-*.tar.xz.sha256
          # The .xz is compressed already.
          compression-level: 0
          retention-days: 7
  publish:
    # Tags only: a hand-started run stops at the artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [notes, appimage, source]
    runs-on: ubuntu-24.04
    # Downloads about 0.8 GB of artifacts and uploads them to the release.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fthrust-appimage-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fthrust-source-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - run: cd dist && sha256sum -c FTHRust-*.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          {
            printf '%s\n\n' 'Two downloads, the same build: `FTHRust-*.AppImage` is one file you run directly; `FTHRust-*.tar.gz` is the same binaries and bundled FFmpeg as a folder (bin/, lib/, share/). See docs/install.md.'
            cat notes/release-notes.md
            printf '\n%s\n\n' '---'
            printf '%s\n\n' '**Verify a download.** `sha256sum -c` with its `.sha256` file checks the bytes; `gh attestation verify FTHRust-<version>-x86_64.AppImage --repo '"$GITHUB_REPOSITORY"'` checks that GitHub Actions built it from this repository (build provenance).'
            printf '%s\n' '**Source of the bundled FFmpeg.** `FTHRust-ffmpeg-source-*.tar.xz` holds the FFmpeg commit, the build scripts and the source of every library compiled into the FFmpeg libraries in both downloads, except what those scripts download while building. `THIRD_PARTY_NOTICES.md` inside them lists every bundled component and its licence, and names those exceptions.'
          } > body.md
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag \
            --title "FTHRust Clips ${GITHUB_REF_NAME#v}" --notes-file body.md --generate-notes \
            dist/FTHRust-*
