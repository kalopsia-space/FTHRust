[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
md-5 = "0.11"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
zip = "9"
tempfile = "3"
ffmpeg-next = "9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fast_image_resize = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
nix = { version = "0.31", features = ["fs", "user", "poll", "signal", "time"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
libspa = "0.10"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "screenshot", "global_shortcuts", "notification", "file_chooser"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
memmap2 = "0.9"
raw-window-handle = "0.6"
notify = "8"
crossbeam-channel = "0.5"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "default_fonts", "accesskit"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg", "image"] }
resvg = { version = "0.45", default-features = false }
egui-wgpu = { version = "0.37", features = ["wayland", "winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland"] }
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
pollster = "0.4"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

# CI linkers ran out of space/memory on full debug info for the large test
# binaries (ld: Bus error); line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

# Image decode/resize, shaping and video conversion run on the UI thread at
# first use; unoptimised they block a frame for seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = "line-tables-only"
