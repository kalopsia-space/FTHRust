[advisories]
unmaintained = "all"
# zbus 5.x sub-crates are marked unmaintained in favour of zbus 6, but
# ashpd 0.13 (the only portal crate) pins zbus ^5. Revisit when ashpd 0.14
# lands on zbus 6.
# RUSTSEC-2023-0071 (rsa, Marvin timing attack) concerns private-key
# operations; the uploader only verifies RSA host-key signatures and logs in
# with a password, so it never decrypts or signs with an RSA key.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372", "RUSTSEC-2023-0071"]

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "WTFPL",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
