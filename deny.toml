[advisories]
unmaintained = "all"
# zbus 5.x sub-crates are marked unmaintained in favour of zbus 6, but
# ashpd 0.13 (the only portal crate) pins zbus ^5. Revisit when ashpd 0.14
# lands on zbus 6.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[licenses]
allow = [
    "GPL-3.0",
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "MIT-0",
    "BSL-1.0",
    "bzip2-1.0.6",
    "WTFPL",
    "Apache-2.0 WITH LLVM-exception",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CC0-1.0",
]
